# SelfRedWP Training Config
# Self-guided red-waypoint policy: predicted trajectory is rendered as a red
# dot onto the image, and the control head conditions on that annotated
# image directly (explicit guidance, vs. TrajKD's implicit auxiliary loss).
# Curriculum ramps the dot source from ground-truth waypoints to the model's
# own (detached) predicted waypoints, to avoid train/deploy distribution
# mismatch (deployment always uses self-predicted).
#
# Usage:
#   conda activate dbc241
#   cd /home/l/uav_kd_project
#   python kd_uav/train/train_self_red_wp.py --config configs/train/self_red_wp.yaml

dataset:
  processed_dir: data/processed/uav_kd_v002
  image_size: [224, 224]
  filter_static: true
  filter_valid_traj: true       # required: trajectory supervision needs non-degenerate labels

model:
  pretrained: true              # ImageNet pretrained MobileNetV2 backbone
  freeze_backbone: false        # fine-tune entire network
  hidden_dim: 256
  dropout: 0.3
  K: 10                         # number of future body-frame waypoints

loss:
  ctrl_weights: [1.0, 1.0, 1.0, 1.0]   # [vx_b, vy_b, vz_b, yaw_rate]
  traj_weights: [1.0, 1.0, 1.0]        # [dx, dy, dz]
  lambda_traj: 1.0                     # L = lambda_traj * L_traj + L_ctrl

curriculum:
  lookahead: 1.0                # metres — matches select_active_waypoint / BC-RedWP default
  p_self_start_epoch: 5         # p_self = 0 for epoch <= this (pure ground-truth warmup)
  p_self_ramp_end_epoch: 35     # p_self linearly ramps 0->1 between start and this epoch,
                                 # held at 1.0 (pure self-predicted) for the remaining epochs
  # Validation always uses self-predicted (detached) waypoints, matching the
  # actual deployment condition — not mixed with the training curriculum.

train:
  epochs: 50
  batch_size: 32
  num_workers: 2
  lr: 1.0e-4
  weight_decay: 1.0e-4
  lr_scheduler: cosine          # cosine | step | none
  lr_warmup_epochs: 3

output:
  runs_dir: runs/self_red_wp
  save_every: 10                # save checkpoint every N epochs
